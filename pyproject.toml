[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshcore-weather"
version = "0.1.0"
description = "EMWIN weather data service for Meshcore radio networks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Rafael Pesquera", email = "rafael@pesquera.com" }]
dependencies = [
    "meshcore>=2.3",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # pyIEM is the canonical NWS text product parser (VTEC, UGC, polygons).
    # We use it with legacy_dict UGCProvider for offline operation — no DB.
    "pyIEM>=1.26",
    # pyIEM imports psycopg, which needs libpq. The binary wheel carries its
    # own (linux aarch64 and x86_64, macOS arm64), so a bare-metal install
    # needs no `apt install libpq5`. No wheel exists for 32-bit ARM: run a
    # 64-bit OS.
    "psycopg[binary]>=3.1",
    # pytz + tzdata are required for pyIEM's timezone resolution on slim
    # Docker images. Without them, every NWS product from a timezone that
    # uses legacy aliases (US/Central, US/Eastern, etc.) fails to parse
    # with "No time zone found with key US/Central". The slim base image
    # strips /usr/share/zoneinfo so Python's zoneinfo module needs the
    # tzdata package for the IANA timezone database.
    "pytz>=2024.1",
    "tzdata>=2024.1",
    "paho-mqtt>=2.0",
    # Radar (spec 7D): the dish delivers the Weather Service's radar mosaics as
    # GIFs, and these two turn one into a tile. numpy is already here by way
    # of pyIEM; it is named because the bot now imports it itself.
    "Pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
portal = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
]
sdr = [
    "numpy>=1.26",
]

[project.scripts]
meshcore-weather = "meshcore_weather.main:main"
meshcore-weather-cli = "meshcore_weather.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
meshcore_weather = [
    "geodata/*.json",
    "client_data/*.json",
    "client_data/*.geojson",
    "portal/templates/*.html",
    "portal/static/*.css",
    "portal/static/*.js",
    "radar/*.json",
    "radar/masks/*.png",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# pytest-asyncio 1.4.1 warns at every run while this is unset. There are no
# async fixtures, so the scope changes nothing today.
asyncio_default_fixture_loop_scope = "function"
