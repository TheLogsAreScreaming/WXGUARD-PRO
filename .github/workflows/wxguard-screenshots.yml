name: WXGUARD PRO Demo Screenshots
on:
  push:
    branches: [main, 'feature/**']
    paths-ignore:
      - 'screenshots/**'
      - 'README.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  screenshots:
    if: github.repository == 'TheLogsAreScreaming/WXGUARD-PRO'
    # Pinned: ubuntu-latest is now 26.04, which Playwright 1.58 cannot install Chromium on.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser screenshot tool
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local demo server
        run: |
          python3 -m http.server 8765 --directory web > /tmp/wxguard-demo-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/demo.html > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Capture desktop and mobile screenshots
        run: |
          mkdir -p screenshots
          web/node_modules/.bin/playwright screenshot --browser chromium --viewport-size '1440,1000' --wait-for-timeout 1200 --full-page http://127.0.0.1:8765/demo.html screenshots/wxguard-pro-desktop.png
          web/node_modules/.bin/playwright screenshot --browser chromium --viewport-size '390,844' --wait-for-timeout 1200 --full-page http://127.0.0.1:8765/demo.html screenshots/wxguard-pro-mobile.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: wxguard-pro-demo-screenshots
          path: screenshots/*.png
          if-no-files-found: error
      - name: Open screenshot update PR (protected main)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screenshots/wxguard-pro-desktop.png screenshots/wxguard-pro-mobile.png
          if git diff --cached --quiet; then
            echo 'Screenshots already match the committed README images.'
            exit 0
          fi
          branch="automation/wxguard-demo-screenshots"
          git switch -c "$branch"
          git commit -m 'docs: refresh WXGUARD PRO demo screenshots'
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          if gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
            echo 'Screenshot update PR already open.'
          else
            gh pr create --base main --head "$branch" --title 'docs: refresh WXGUARD PRO demo screenshots' --body 'Automated Chromium desktop and mobile screenshots of the simulated demo. This PR follows the protected main-branch review and CI requirements.'
          fi
